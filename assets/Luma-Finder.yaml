# Luma Finder for Windows 11 File Explorer Styler.
# Paste into Settings > Textual mode. Designed for Windows dark app mode.
theme: ""
backgroundTranslucentEffect: mica
backgroundTranslucentEffectRegion: ""
explorerFrameContainerHeight: 0

styleConstants:
  - Surface=#FF202720
  - Field=#FF252E26
  - Selection=#FF364439
  - Hover=#FF343E35
  - Pressed=#FF414E43
  - Stroke=#FF414D42
  - Menu=#FF242C25

controlStyles:
  - target: Grid#NavigationBarControlGrid
    styles:
      - Background=$Surface
      - Margin=8,2,8,1
      - CornerRadius=14

  - target: FileExplorerExtensions.AddressBarControl > Grid#PART_LayoutRoot
    styles:
      - Background=$Field
      - BorderBrush=$Stroke
      - BorderThickness=1
      - CornerRadius=14

  - target: AutoSuggestBox#PART_AutoSuggestBox > Grid#LayoutRoot > TextBox#TextBox
    styles:
      - CornerRadius=14

  - target: AutoSuggestBox#FileExplorerSearchBox > Grid#LayoutRoot > TextBox > Grid@CommonStates > Border#BorderElement
    styles:
      - Background@Normal=$Field
      - Background@PointerOver=$Hover
      - Background@Focused=$Field
      - BorderBrush@Normal=$Stroke
      - CornerRadius=14

  - target: FileExplorerExtensions.CommandBarControl_Wave1 > Grid, Grid#CommandBarControlRootGrid
    styles:
      - Background=Transparent

  - target: CommandBar#FileExplorerCommandBar
    styles:
      - Background=$Surface
      - BorderBrush=$Stroke
      - BorderThickness=1
      - CornerRadius=15
      - Margin=8,3,8,5
      - Padding=5,0,5,0

  - target: AppBarButton > Grid#Root@CommonStates > Border#AppBarButtonInnerBorder
    styles:
      - CornerRadius=10
      - Background@PointerOver=$Hover
      - Background@Pressed=$Pressed

  - target: TabViewItem > Grid#LayoutRoot > Canvas > Microsoft.UI.Xaml.Shapes.Path#SelectedBackgroundPath
    styles:
      - Fill=$Selection

  - target: Grid#DetailsViewControlRootGrid, Grid#HomeViewRootGrid
    styles:
      - Background=$Surface
      - CornerRadius=12

  - target: CommandBarOverflowPresenter#SecondaryItemsControl > Grid#LayoutRoot, MenuFlyoutPresenter > Border
    styles:
      - Background=$Menu
      - BorderBrush=$Stroke
      - BorderThickness=1
      - CornerRadius=12

  - target: Grid#OuterOverflowContentRootV2
    styles:
      - CornerRadius=12
